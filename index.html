<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gefina: do zero à API de faturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--grid:#d9e0ea;--fg:#14213d;--mut:#55627d;--card:#fff;--line:#c9d3e3;--a:#2d5be3;--mk:#ffd23f;--ok:#168a5b;--bad:#d23c3c;--code:#14213d;--cf:#e9eefc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--grid:#1b2640;--fg:#eaf0ff;--mut:#9aa8c7;--card:#18223a;--line:#2a3858;--a:#7da2ff;--ok:#4fd19a;--bad:#ff8080;--code:#080d19}}
:root[data-theme="dark"]{--bg:#0f1626;--grid:#1b2640;--fg:#eaf0ff;--mut:#9aa8c7;--card:#18223a;--line:#2a3858;--a:#7da2ff;--ok:#4fd19a;--bad:#ff8080;--code:#080d19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{--w:min(100vw,calc((100vh - 76px)*16/9));background:var(--bg);color:var(--fg);font:16px/1.4 Figtree,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#stage{position:relative;width:var(--w);aspect-ratio:16/9;container-type:inline-size;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:3cqw 3cqw;overflow:hidden;border:1px solid var(--line)}
.scene{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;gap:2cqw;padding:3.5cqw 6cqw 13cqw}
.scene.on{display:flex}
h1{font:800 10cqw/1 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h2{font:700 4cqw/1.1 'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.sub{font-size:2.4cqw;color:var(--mut);margin:0}
.sub b{color:var(--fg)}
.mk{background:linear-gradient(transparent 55%,var(--mk) 55%) no-repeat 0 0/0% 100%;color:var(--fg);padding:0 .4cqw}
.on .mk{animation:sweep .9s 1.1s ease-out forwards}
@keyframes sweep{to{background-size:100% 100%}}
.logo{width:12cqw;height:12cqw;border-radius:3cqw;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:800 7.5cqw 'Bricolage Grotesque',sans-serif}
.r{opacity:0;transform:translateY(1.2cqw)}
.on .r{animation:rev .6s ease forwards;animation-delay:calc(var(--d)*1s)}
@keyframes rev{to{opacity:1;transform:none}}
.row{display:flex;align-items:center;gap:1.4cqw}
.col{display:flex;flex-direction:column;gap:1.4cqw;flex:1}
.arr{font-size:3cqw;color:var(--a);font-weight:700}
.node{flex:1;background:var(--card);border:.25cqw solid var(--line);border-radius:1.2cqw;padding:1.4cqw 1.6cqw}
.node b{display:block;font-size:2.2cqw}
.node small{display:block;font-size:1.6cqw;color:var(--mut)}
.hl{border-color:var(--a);box-shadow:0 0 0 .4cqw color-mix(in srgb,var(--a) 22%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:1cqw}
.chips span{border:.25cqw solid var(--line);background:var(--card);border-radius:5cqw;padding:.6cqw 1.6cqw;font-size:1.9cqw}
.code{background:var(--code);color:var(--cf);border-radius:1.2cqw;padding:1.6cqw 2cqw;font:600 1.8cqw/1.65 'JetBrains Mono',Consolas,monospace;margin:0;flex:2;white-space:pre-wrap}
.code span{display:block}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.code .ok{color:#4fd19a}.code .bad{color:#ff8080}
.line{display:flex;align-items:center;gap:2cqw;background:var(--card);border:.25cqw solid var(--line);border-radius:1.2cqw;padding:1.1cqw 1.8cqw;font-size:2cqw}
.line code{font:600 1.9cqw 'JetBrains Mono',Consolas,monospace;min-width:27cqw}
.line span{flex:1}
.line em{font:800 2.2cqw 'Bricolage Grotesque',sans-serif;font-style:normal}
.term{background:var(--code);color:var(--cf);border-radius:1cqw;padding:1cqw 2cqw;font:600 2cqw 'JetBrains Mono',Consolas,monospace;display:inline-block}
#cap{position:absolute;left:0;right:0;bottom:0;padding:1.6cqw 4cqw;background:var(--card);border-top:.25cqw solid var(--line);font-size:1.9cqw;line-height:1.4;min-height:9cqw;display:flex;align-items:center}
#start{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 78%,transparent)}
#start button{font-size:3cqw;padding:1.2cqw 3.2cqw}
#ui{width:var(--w);box-sizing:border-box;padding:0 8px;display:flex;align-items:center;gap:8px}
body.hide #ui{visibility:hidden}
button{font:inherit;padding:.4em .9em;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#prog{flex:1;min-width:80px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
#bar{height:100%;width:0;background:var(--a)}
#cnt{font-size:14px;color:var(--mut);min-width:48px;text-align:right}
@media(prefers-reduced-motion:reduce){.r{opacity:1;transform:none;animation:none!important}.mk{background-size:100% 100%;animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="cap"></div>
  <div id="start"><button id="go">Começar</button></div>
</div>
<div id="ui">
  <button id="pv" aria-label="Cena anterior">Anterior</button>
  <button id="pp">Reproduzir</button>
  <button id="nx" aria-label="Próxima cena">Próxima</button>
  <div id="prog"><div id="bar"></div></div>
  <span id="cnt"></span>
  <button id="fs">Tela cheia</button>
</div>
<script>
const r=(d,h,c='')=>`<div class="r ${c}" style="--d:${d}">${h}</div>`;
const N=(d,t,s='',c='')=>r(d,`<b>${t}</b><small>${s}</small>`,`node ${c}`);
const A=d=>r(d,'→','arr');
const C=(l,d=.3,s=.4)=>`<pre class="code">${l.map((x,i)=>`<span class="r" style="--d:${d+i*s}">${x}</span>`).join('')}</pre>`;
const H=t=>r(0,`<h2>${t}</h2>`);
const P=(d,t)=>r(d,`<p class="sub">${t}</p>`);
const T=(d,a)=>r(d,a.map(x=>`<span>${x}</span>`).join(''),'chips');
const L=(d,m,t,s,c='')=>r(d,`<code>${m}</code><span>${t}</span><em class="${c}">${s}</em>`,'line');

const S=[
{t:8000,n:`Neste vídeo, vamos recapitular tudo que construímos no projeto Gefina: uma API de faturas com Node, Express, TypeScript, Biome e o primeiro passo no React.`,
h:`${r(0,'<div class="logo">G</div>')}${r(.2,'<h1>Gefina</h1>')}${r(.5,'<p class="sub"><span class="mk">Do zero à API de faturas</span></p>')}${T(1.4,['Node','Express','TypeScript','Git','Biome','React'])}`},

{t:11000,n:`Pense em um restaurante. O usuário é o cliente, o front-end é o salão que mostra tudo bonito, e o back-end, a API, é a cozinha: guarda os dados e entrega o que for pedido. Cada item do cardápio é um endpoint.`,
h:`${H('Como uma API funciona')}<div class="row">${N(.5,'Usuário','o cliente')}${A(1)}${N(1.3,'Front-end','o salão: mostra tudo bonito')}${A(2)}${N(2.4,'Back-end (API)','a cozinha: guarda e entrega os dados','hl')}</div>${P(3.4,'Cada item do cardápio é um <b>endpoint</b>: um endereço que devolve um dado.')}`},

{t:12000,n:`O nosso cardápio tem quatro pedidos. A rota de saúde diz que o servidor está vivo. Outra devolve todas as faturas, outra devolve só uma pelo número, e o que não existe responde com erro 404.`,
h:`${H('O cardápio da nossa API')}${L(.5,'GET /api/health','“Server is running”','200','ok')}${L(1.8,'GET /api/invoices','lista com as 3 faturas','200','ok')}${L(3.1,'GET /api/invoices/2','só a fatura 2','200','ok')}${L(4.4,'GET /api/invoices/99','Invoice not found','404','bad')}`},

{t:11000,n:`O Express faz o trabalho pesado. Cada rota recebe dois objetos: req, o pedido do cliente, e res, a sua resposta. Em poucas linhas, o servidor já responde.`,
h:`${H('Express: um servidor em poucas linhas')}<div class="row">${C([`import express from 'express'`,`const app = express()`,`app.get('/api/health', (req, res) =&gt; {`,`  res.status(200).json({ success: { status: 200 } })`,`})`,`app.listen(3000)`])}<div class="col">${N(3,'req','o pedido do cliente')}${N(3.8,'res','a sua resposta','hl')}</div></div>`},

{t:15000,n:`Os dois-pontos antes de id marcam a parte variável do endereço. Tudo que vem da URL é texto, então convertemos com Number. O find percorre a lista e devolve a primeira fatura que bate. Se não achar, respondemos 404, e o return é obrigatório. Dinheiro fica em centavos, como número inteiro.`,
h:`${H('Uma fatura pelo ID')}${C([`app.get('/api/invoices/:id', (req, res) =&gt; {`,`  const id = Number(req.params.id)`,`  const invoice = invoices.find((i) =&gt; i.id === id)`,`  if (!invoice) return res.status(404).json(…)`,`  res.status(200).json(invoice)`,`})`])}${T(3.6,['“2” (texto) vira 2 (número)','return obrigatório','125039 = R$ 1.250,39'])}`},

{t:10000,n:`O Express lê as rotas de cima para baixo. A primeira que combina responde. Se nenhuma combinar, o pedido cai no middleware de 404, por isso ele sempre fica por último.`,
h:`${H('A ordem das rotas importa')}${L(.5,'app.get','/api/health','1º')}${L(1.4,'app.get','/api/invoices','2º')}${L(2.3,'app.get','/api/invoices/:id','3º')}${L(3.4,'app.use','tudo que sobrou vira 404','último','bad')}`},

{t:12000,n:`TypeScript é JavaScript com tipos, como um corretor ortográfico para o código. Passar um número onde se espera texto vira erro. O Node roda mesmo com erro, por isso existe o npm run check, que olha o projeto inteiro. Sem mensagem, está tudo certo.`,
h:`${H('TypeScript: JavaScript com tipos')}${C([`function greet(name: string) {}`,`greet("Alex")  <i class="ok">certo</i>`,`greet(30)      <i class="bad">erro: número não cabe em texto</i>`])}${r(2.4,'<span class="term">npm run check</span>')}${P(3.2,'Nenhuma mensagem: tudo certo.')}`},

{t:14000,n:`Em vez de um arquivo fazendo tudo, dividimos em camadas. O server encaminha, a rota entende o pedido e responde, e o service guarda e busca os dados. Como o prefixo já entra pelo server, repeti-lo na rota gerava o desafio da rota duplicada.`,
h:`${H('Arquitetura em camadas')}<div class="row">${N(.4,'Cliente','faz o pedido')}${A(.9)}${N(1.2,'server.ts','encaminha')}${A(1.7)}${N(2,'invoice.route.ts','entende e responde')}${A(2.5)}${N(2.8,'invoice.service.ts','guarda e busca','hl')}</div>${P(3.8,'“Eu não posso, mas eu sei quem pode.”')}${T(5,['/api/invoices + /api/invoices = /api/invoices/api/invoices'])}`},

{t:10000,n:`A interface é o molde de uma fatura. O type com valores exatos garante que o status só pode ser paid ou pending. Se faltar um campo, o TypeScript avisa na hora.`,
h:`${H('Interface: o molde da fatura')}${C([`type InvoiceStatus = 'paid' | 'pending'`,`&nbsp;`,`interface Invoice {`,`  id: number`,`  amount: number`,`  status: InvoiceStatus`,`  customer: { id: number; name: string; email: string }`,`}`],.3,.35)}`},

{t:14000,n:`O fluxo profissional: uma issue descreve a tarefa, os critérios dizem quando está pronta, escrevemos o código e fazemos um commit com tipo: feat para funcionalidade, chore para configuração, refactor para reorganizar. Com Closes e o número, o GitHub fecha a issue sozinho.`,
h:`${H('Da issue ao commit')}<div class="row">${N(.4,'Issue','a tarefa')}${A(.9)}${N(1.2,'Critérios','quando está pronta')}${A(1.7)}${N(2,'Código','a solução')}${A(2.5)}${N(2.8,'Commit','com tipo')}${A(3.3)}${N(3.6,'Closes #4','fecha a issue','hl')}</div>${T(4.6,['feat: funcionalidade nova','chore: configuração','refactor: reorganizar sem mudar o resultado'])}`},

{t:13000,n:`O Biome formata e confere o código numa ferramenta só. O check só mostra os problemas, o fix corrige o que é seguro, e o fix:unsafe corrige também o que é arriscado, como renomear parâmetros sem uso. Instalamos com versão exata, para nada mudar sozinho.`,
h:`${H('Biome: formatar e conferir')}<div class="row">${N(.5,'npm run check','só mostra os problemas')}${A(1.2)}${N(1.6,'npm run fix','corrige o que é seguro')}${A(2.3)}${N(2.7,'npm run fix:unsafe','corrige também o arriscado','hl')}</div>${T(3.8,['npm i -D -E: versão exata','req sem uso vira _req'])}`},

{t:13000,n:`Depois separamos o projeto: a pasta api com o back-end e a pasta web com o front-end. No web, o primeiro React: a biblioteca vem da internet, o Babel traduz o JSX, e o texto aparece na tela.`,
h:`${H('api e web: dois programas')}<div class="row">${C([`gefina/`,`├── api/   back-end: Express + TypeScript`,`├── web/   front-end: React`,`├── biome.json`,`└── package.json`],.3,.5)}<div class="col">${N(3,'React pela internet','a biblioteca vem da CDN')}${N(3.8,'Babel','traduz o JSX em JavaScript')}${N(4.6,'Tela','&lt;h1&gt;React Course&lt;/h1&gt;','hl')}</div></div>`},

{t:11000,n:`O próximo passo é a issue número cinco: um projeto próprio para a interface, com ferramenta de build, TypeScript e módulos, mostrando a tabela de faturas. Você construiu uma API de verdade. Até a próxima aula!`,
h:`${H('Próxima parada')}${N(.5,'Issue #5','a interface vira um projeto próprio','hl')}${T(1.5,['ferramenta de build','TypeScript','módulos','tabela de faturas'])}${P(3,'Você construiu uma API de verdade.')}`}
];

const $=id=>document.getElementById(id);
$('scenes').innerHTML=S.map((s,k)=>`<section class="scene">${s.h}</section>`).join('');
const sc=[...document.querySelectorAll('.scene')];
let i=0,play=false,tm;

function bar(on){
  const b=$('bar');
  b.style.transition='none';
  b.style.width=(i/S.length*100)+'%';
  void b.offsetWidth;
  if(on){b.style.transition='width '+S[i].t+'ms linear';b.style.width=((i+1)/S.length*100)+'%'}
}
function show(n){
  clearTimeout(tm);
  sc[i].classList.remove('on');
  i=(n+S.length)%S.length;
  void sc[i].offsetWidth;
  sc[i].classList.add('on');
  $('cap').textContent=S[i].n;
  $('cnt').textContent=(i+1)+' / '+S.length;
  bar(play);
  if(play)tm=setTimeout(next,S[i].t);
}
function next(){if(i<S.length-1)show(i+1);else setPlay(false)}
function setPlay(v){
  play=v;
  $('pp').textContent=v?'Pausar':'Reproduzir';
  if(v){show(i)}else{
    clearTimeout(tm);
    const b=$('bar'),w=getComputedStyle(b).width;
    b.style.transition='none';b.style.width=w;
  }
}
function begin(){$('start').style.display='none';setPlay(true)}
function fs(){
  try{(document.fullscreenElement?document.exitFullscreen():$('stage').requestFullscreen()).catch(()=>{})}catch(e){}
}
$('go').onclick=begin;
$('pp').onclick=()=>setPlay(!play);
$('nx').onclick=()=>show(i+1);
$('pv').onclick=()=>show(i-1);
$('fs').onclick=fs;
document.addEventListener('keydown',e=>{
  if(e.target.closest('button'))return;
  if(e.key===' '){e.preventDefault();$('start').style.display!=='none'?begin():setPlay(!play)}
  else if(e.key==='ArrowRight')show(i+1);
  else if(e.key==='ArrowLeft')show(i-1);
  else if(e.key==='f'||e.key==='F')fs();
  else if(e.key==='h'||e.key==='H')document.body.classList.toggle('hide');
});
sc[0].classList.add('on');
$('cap').textContent=S[0].n;
$('cnt').textContent='1 / '+S.length;
</script>
</body>
</html>
